Diagram:
  DefinitionFiles:
    - Type: URL
      Url: "https://raw.githubusercontent.com/awslabs/diagram-as-code/main/definitions/definition-for-aws-icons-light.yaml"

  # Production pattern: the receiver EC2 sits in a private subnet with no public IP. The Ground
  # Station flow arrives on a second ENI with an Elastic IP placed in a PUBLIC subnet (same AZ),
  # routed through the Internet Gateway. Outbound traffic from the instance goes through the NAT
  # Gateway; AWS service traffic stays on VPC endpoints.

  Resources:
    Canvas:
      Type: AWS::Diagram::Canvas
      Direction: horizontal
      Children:
        - GroundStation
        - AWSCloud
        - Internet

    GroundStation:
      Type: AWS::Diagram::Resource
      Preset: "AWS Ground Station"
      Title: "AWS Ground Station"
      Align: center

    Internet:
      Type: AWS::Diagram::Resource
      Preset: "Internet"
      Title: "Internet (TLE, mises a jour)"
      Align: center

    AWSCloud:
      Type: AWS::Diagram::Cloud
      Preset: AWSCloudNoLogo
      Align: center
      Children:
        - VPC

    VPC:
      Type: AWS::EC2::VPC
      Title: "VPC 10.0.0.0/16"
      Direction: vertical
      Children:
        - IGW
        - PublicSubnet
        - PrivateSubnet
        - Endpoints

    IGW:
      Type: AWS::EC2::InternetGateway
      Title: "Internet Gateway"

    PublicSubnet:
      Type: AWS::EC2::Subnet
      Preset: PublicSubnet
      Title: "Subnet public 10.0.1.x"
      Direction: horizontal
      Children:
        - ENI
        - NAT

    ENI:
      Type: AWS::EC2::NetworkInterface
      Title: "2e ENI + EIP (flux GS)"

    NAT:
      Type: AWS::EC2::NatGateway
      Title: "NAT Gateway"

    PrivateSubnet:
      Type: AWS::EC2::Subnet
      Preset: PrivateSubnet
      Title: "Subnet prive 10.0.2.x"
      Children:
        - EC2

    EC2:
      Type: AWS::EC2::Instance
      Title: "EC2 SDR + agent GS (sans IP publique)"

    Endpoints:
      Type: AWS::EC2::VPCEndpoint
      Title: "VPC Endpoints : S3, SQS, KMS"

  Links:
    - Source: GroundStation
      SourcePosition: E
      Target: IGW
      TargetPosition: W
      TargetArrowHead:
        Type: Open
      Labels:
        AutoLeft:
          Title: "UDP 55888-56000"

    - Source: IGW
      SourcePosition: S
      Target: ENI
      TargetPosition: N
      TargetArrowHead:
        Type: Open

    - Source: ENI
      SourcePosition: S
      Target: EC2
      TargetPosition: NW
      TargetArrowHead:
        Type: Open

    - Source: EC2
      SourcePosition: NE
      Target: NAT
      TargetPosition: S
      TargetArrowHead:
        Type: Open

    - Source: NAT
      SourcePosition: N
      Target: IGW
      TargetPosition: E
      TargetArrowHead:
        Type: Open

    - Source: IGW
      SourcePosition: NE
      Target: Internet
      TargetPosition: W
      TargetArrowHead:
        Type: Open

    - Source: EC2
      SourcePosition: S
      Target: Endpoints
      TargetPosition: N
      TargetArrowHead:
        Type: Open
