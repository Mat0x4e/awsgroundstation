Diagram:
  DefinitionFiles:
    - Type: URL
      Url: "https://raw.githubusercontent.com/awslabs/diagram-as-code/main/definitions/definition-for-aws-icons-light.yaml"

  Resources:
    Canvas:
      Type: AWS::Diagram::Canvas
      Direction: vertical
      Children:
        - Title
        - Body

    Title:
      Type: AWS::Diagram::Resource
      Title: "protogroundstation - NOAA-20 X-band DigIF to geolocated VIIRS Level 1 - AWS Batch runtime (deployed 2026-10-22) - one contact, ~43 GB, ~90 min"
      Align: center

    Body:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - Unmanaged
        - AWSCloud

    Unmanaged:
      Type: AWS::Diagram::VerticalStack
      Children:
        - Satellite
        - Planner
        - TLE
        - LUTServer

    Satellite:
      Type: AWS::Diagram::Resource
      Preset: "Satellite"
      Title: "NOAA-20 (43013)"
      Align: center

    Planner:
      Type: AWS::Diagram::Resource
      Preset: "Toolkit"
      Title: "plan_pass.py"
      Align: center

    TLE:
      Type: AWS::Diagram::Resource
      Preset: "Server"
      Title: "celestrak.org - TLE"
      Align: center

    LUTServer:
      Type: AWS::Diagram::Resource
      Preset: "Server"
      Title: "jpssdb.ssec.wisc.edu - CSPP LUTs"
      Align: center

    AWSCloud:
      Type: AWS::Diagram::Cloud
      Preset: AWSCloudNoLogo
      Direction: vertical
      Align: center
      Children:
        - RegionAntenna
        - RegionMain

    RegionAntenna:
      Type: AWS::Region
      Title: "eu-north-1 / us-east-2 - rented antenna"
      Children:
        - GroundStation

    GroundStation:
      Type: AWS::Diagram::Resource
      Preset: "AWS Ground Station"
      Title: "Stockholm 1 / Ohio 1"
      Align: center

    RegionMain:
      Type: AWS::Region
      Title: "eu-central-1 - reception, processing, products"
      Direction: vertical
      Children:
        - RowTrigger
        - RowChunks
        - RowProducts

    RowTrigger:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - ReceptionBucket
        - EventBridge
        - StepFunctions

    ReceptionBucket:
      Type: AWS::S3::Bucket
      Title: "reception - 22 x 2.18 GB .pcap"
      Align: center

    EventBridge:
      Type: AWS::Events::Rule
      Title: "EventBridge - contact COMPLETED"
      Align: center

    StepFunctions:
      Type: AWS::StepFunctions
      Title: "Step Functions"
      Align: center

    RowChunks:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - ECR
        - BatchChunks
        - BatchAgg

    ECR:
      Type: AWS::ECR
      Title: "ECR - SatDump, RT-STPS, CSPP (sdr-pipeline image)"
      Align: center

    BatchChunks:
      Type: AWS::Batch
      Title: "AWS Batch - Spot fan-out, N chunk jobs (<=19 parallel)"
      Align: center

    BatchAgg:
      Type: AWS::Batch
      Title: "AWS Batch - on-demand aggregation (RT-STPS + CSPP)"
      Align: center

    RowProducts:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - OutputBucket
        - VizLambda
        - BatchRender
        - ViirsECR
        - SNS

    OutputBucket:
      Type: AWS::S3::Bucket
      Title: "output - cadu, RDR, SDR+GEO, products"
      Align: center

    VizLambda:
      Type: AWS::Lambda::Function
      Title: "VIIRS orchestrator Lambda (RENDER_COMPUTE=batch)"
      Align: center

    BatchRender:
      Type: AWS::Batch
      Title: "AWS Batch - on-demand render (satdump | nasa)"
      Align: center

    ViirsECR:
      Type: AWS::ECR
      Title: "ECR - viirs-visualization (dedicated render image)"
      Align: center

    SNS:
      Type: AWS::SNS::Topic
      Title: "SNS - failures"
      Align: center

  Links:
    - Source: Satellite
      SourcePosition: NNE
      Target: GroundStation
      TargetPosition: WNW
      TargetArrowHead:
        Type: Open
      Labels:
        SourceLeft:
          Title: "X-band HRD 15 Mbps"

    - Source: Planner
      SourcePosition: E
      Target: GroundStation
      TargetPosition: SSW
      TargetArrowHead:
        Type: Open
      Labels:
        TargetLeft:
          Title: "reserve-contact"

    - Source: TLE
      SourcePosition: N
      Target: Planner
      TargetPosition: S
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    - Source: GroundStation
      SourcePosition: S
      Target: ReceptionBucket
      TargetPosition: N
      TargetArrowHead:
        Type: Open
      Type: orthogonal
      Labels:
        SourceRight:
          Title: "DigIF cross-region"

    - Source: GroundStation
      SourcePosition: SE
      Target: EventBridge
      TargetPosition: N
      TargetArrowHead:
        Type: Open
      Labels:
        TargetRight:
          Title: "contact COMPLETED"

    - Source: EventBridge
      SourcePosition: E
      Target: StepFunctions
      TargetPosition: W
      TargetArrowHead:
        Type: Open

    - Source: StepFunctions
      SourcePosition: SW
      Target: ReceptionBucket
      TargetPosition: SE
      LineStyle: dashed
      TargetArrowHead:
        Type: Open
      Labels:
        TargetLeft:
          Title: "list chunks"

    - Source: StepFunctions
      SourcePosition: S
      Target: BatchChunks
      TargetPosition: NE
      TargetArrowHead:
        Type: Open
      Labels:
        TargetRight:
          Title: "Map -> submitJob.sync"

    - Source: ECR
      SourcePosition: E
      Target: BatchChunks
      TargetPosition: W
      TargetArrowHead:
        Type: Open

    - Source: BatchChunks
      SourcePosition: E
      Target: BatchAgg
      TargetPosition: W
      TargetArrowHead:
        Type: Open


    - Source: BatchAgg
      SourcePosition: NE
      Target: LUTServer
      TargetPosition: E
      TargetArrowHead:
        Type: Open
      Labels:
        TargetRight:
          Title: "sdr_luts.sh (HTTP 80)"

    - Source: BatchChunks
      SourcePosition: S
      Target: OutputBucket
      TargetPosition: NE
      TargetArrowHead:
        Type: Open
      Labels:
        SourceLeft:
          Title: "cadu"

    - Source: BatchAgg
      SourcePosition: S
      Target: OutputBucket
      TargetPosition: E
      TargetArrowHead:
        Type: Open
      Labels:
        TargetRight:
          Title: "RDR, SDR, GEO"

    - Source: OutputBucket
      SourcePosition: E
      Target: VizLambda
      TargetPosition: W
      TargetArrowHead:
        Type: Open

    - Source: VizLambda
      SourcePosition: E
      Target: BatchRender
      TargetPosition: W
      TargetArrowHead:
        Type: Open
      Labels:
        TargetRight:
          Title: "submit_job"

    - Source: ViirsECR
      SourcePosition: N
      Target: BatchRender
      TargetPosition: S
      TargetArrowHead:
        Type: Open

    - Source: BatchRender
      SourcePosition: N
      Target: OutputBucket
      TargetPosition: SE
      LineStyle: dashed
      TargetArrowHead:
        Type: Open
      Labels:
        SourceRight:
          Title: "png/geotiff -> products/"


    - Source: StepFunctions
      SourcePosition: SE
      Target: SNS
      TargetPosition: NE
      LineStyle: dashed
      TargetArrowHead:
        Type: Open
      Labels:
        TargetRight:
          Title: "on failure"
