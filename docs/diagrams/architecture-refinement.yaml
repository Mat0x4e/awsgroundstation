Diagram:
  DefinitionFiles:
    - Type: URL
      Url: "https://raw.githubusercontent.com/awslabs/diagram-as-code/main/definitions/definition-for-aws-icons-light.yaml"

  Resources:
    Canvas:
      Type: AWS::Diagram::Canvas
      Direction: vertical
      Children:
        - Title
        - Body

    Title:
      Type: AWS::Diagram::Resource
      Title: "protogroundstation - Well-Architected refinement - DEPLOYED state 2026-10-22 (deltas [+] new / [~] changed); runtime compute now AWS Batch (ADR-002)"
      Align: center

    Body:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - Unmanaged
        - AWSCloud

    Unmanaged:
      Type: AWS::Diagram::VerticalStack
      Children:
        - Satellite
        - Planner
        - TLE
        - LUTServer

    Satellite:
      Type: AWS::Diagram::Resource
      Preset: "Satellite"
      Title: "NOAA-20 (43013)"
      Align: center

    Planner:
      Type: AWS::Diagram::Resource
      Preset: "Toolkit"
      Title: "plan_pass.py"
      Align: center

    TLE:
      Type: AWS::Diagram::Resource
      Preset: "Server"
      Title: "celestrak.org - TLE"
      Align: center

    LUTServer:
      Type: AWS::Diagram::Resource
      Preset: "Server"
      Title: "jpssdb.ssec.wisc.edu - CSPP LUTs (off hot path [~] PERF-1)"
      Align: center

    AWSCloud:
      Type: AWS::Diagram::Cloud
      Preset: AWSCloudNoLogo
      Direction: vertical
      Align: center
      Children:
        - RegionAntenna
        - RegionMain

    RegionAntenna:
      Type: AWS::Region
      Title: "eu-north-1 / us-east-2 - rented antenna"
      Children:
        - GroundStation

    GroundStation:
      Type: AWS::Diagram::Resource
      Preset: "AWS Ground Station"
      Title: "Stockholm 1 / Ohio 1"
      Align: center

    RegionMain:
      Type: AWS::Region
      Title: "eu-central-1 - reception, processing, products, observability"
      Direction: vertical
      Children:
        - RowBuild
        - RowTrigger
        - RowChunks
        - RowProducts
        - RowObservability

    RowBuild:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - CodeBuildImage
        - LUTCache

    CodeBuildImage:
      Type: AWS::CodeBuild::Project
      Title: "[+] CodeBuild - SDR + viirs image builds (OE-1, in Terraform; build from main)"
      Align: center

    LUTCache:
      Type: AWS::S3::Bucket
      Title: "[+] S3 - CSPP LUT/ancillary cache (PERF-1)"
      Align: center

    RowTrigger:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - ReceptionBucket
        - EventBridge
        - StepFunctions

    ReceptionBucket:
      Type: AWS::S3::Bucket
      Title: "reception - 22 x 2.18 GB .pcap"
      Align: center

    EventBridge:
      Type: AWS::Events::Rule
      Title: "EventBridge - contact COMPLETED"
      Align: center

    StepFunctions:
      Type: AWS::StepFunctions
      Title: "Step Functions"
      Align: center

    RowChunks:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - ECR
        - BatchChunks
        - BatchAgg

    ECR:
      Type: AWS::ECR
      Title: "ECR - SatDump, RT-STPS, CSPP"
      Align: center

    BatchChunks:
      Type: AWS::Batch
      Title: "[~] AWS Batch - Spot fan-out, N chunk jobs (ADR-002, was CodeBuild)"
      Align: center

    BatchAgg:
      Type: AWS::Batch
      Title: "[~] AWS Batch - on-demand aggregation (ADR-002, was CodeBuild)"
      Align: center

    RowProducts:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - OutputBucket
        - VizLambda
        - BatchRender
        - CloudWatch

    OutputBucket:
      Type: AWS::S3::Bucket
      Title: "output - cadu, RDR, SDR+GEO, products"
      Align: center

    VizLambda:
      Type: AWS::Lambda::Function
      Title: "[~] VIIRS orchestrator (RENDER_COMPUTE=batch -> submit_job)"
      Align: center

    BatchRender:
      Type: AWS::Batch
      Title: "[+] AWS Batch - on-demand render, dedicated viirs image (ADR-002 Stage 3)"
      Align: center

    CloudWatch:
      Type: AWS::CloudWatch
      Title: "[+] CloudWatch - ProductsWritten / VisualizationFailed / Chunks (REL-1/2/3/4)"
      Align: center

    RowObservability:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - Alarms
        - SNS

    Alarms:
      Type: AWS::CloudWatch::Alarm
      Title: "[+] Alarms - ExecutionsFailed, ProductsWritten==0 (REL-1)"
      Align: center

    SNS:
      Type: AWS::SNS::Topic
      Title: "SNS - failures + degraded-but-green signals"
      Align: center

  Links:
    - Source: Satellite
      SourcePosition: NNE
      Target: GroundStation
      TargetPosition: WNW
      TargetArrowHead:
        Type: Open
      Labels:
        SourceLeft:
          Title: "X-band HRD 15 Mbps"

    - Source: Planner
      SourcePosition: E
      Target: GroundStation
      TargetPosition: SSW
      TargetArrowHead:
        Type: Open
      Labels:
        TargetLeft:
          Title: "reserve-contact"

    - Source: TLE
      SourcePosition: N
      Target: Planner
      TargetPosition: S
      TargetArrowHead:
        Type: Open
      Type: orthogonal

    - Source: GroundStation
      SourcePosition: S
      Target: ReceptionBucket
      TargetPosition: N
      TargetArrowHead:
        Type: Open
      Type: orthogonal
      Labels:
        SourceRight:
          Title: "DigIF cross-region"

    - Source: GroundStation
      SourcePosition: SE
      Target: EventBridge
      TargetPosition: N
      TargetArrowHead:
        Type: Open
      Labels:
        TargetRight:
          Title: "contact COMPLETED"

    - Source: EventBridge
      SourcePosition: E
      Target: StepFunctions
      TargetPosition: W
      TargetArrowHead:
        Type: Open

    - Source: CodeBuildImage
      SourcePosition: S
      Target: ECR
      TargetPosition: NW
      LineStyle: dashed
      TargetArrowHead:
        Type: Open
      Labels:
        TargetLeft:
          Title: "[+] push image"

    - Source: LUTCache
      SourcePosition: S
      Target: BatchAgg
      TargetPosition: NW
      LineStyle: dashed
      TargetArrowHead:
        Type: Open
      Labels:
        SourceRight:
          Title: "[+] staged, not fetched"

    - Source: StepFunctions
      SourcePosition: SW
      Target: ReceptionBucket
      TargetPosition: SE
      LineStyle: dashed
      TargetArrowHead:
        Type: Open
      Labels:
        TargetLeft:
          Title: "list chunks"

    - Source: StepFunctions
      SourcePosition: S
      Target: BatchChunks
      TargetPosition: NE
      TargetArrowHead:
        Type: Open
      Labels:
        TargetRight:
          Title: "Map -> submitJob.sync"

    - Source: ECR
      SourcePosition: E
      Target: BatchChunks
      TargetPosition: W
      TargetArrowHead:
        Type: Open

    - Source: BatchChunks
      SourcePosition: E
      Target: BatchAgg
      TargetPosition: W
      TargetArrowHead:
        Type: Open

    - Source: BatchChunks
      SourcePosition: S
      Target: OutputBucket
      TargetPosition: NE
      TargetArrowHead:
        Type: Open
      Labels:
        SourceLeft:
          Title: "cadu"

    - Source: BatchAgg
      SourcePosition: S
      Target: OutputBucket
      TargetPosition: E
      TargetArrowHead:
        Type: Open
      Labels:
        TargetRight:
          Title: "RDR, SDR, GEO"

    - Source: OutputBucket
      SourcePosition: E
      Target: VizLambda
      TargetPosition: W
      TargetArrowHead:
        Type: Open

    - Source: VizLambda
      SourcePosition: E
      Target: BatchRender
      TargetPosition: W
      TargetArrowHead:
        Type: Open
      Labels:
        TargetRight:
          Title: "[+] submit_job"

    - Source: BatchRender
      SourcePosition: S
      Target: CloudWatch
      TargetPosition: N
      LineStyle: dashed
      TargetArrowHead:
        Type: Open
      Labels:
        SourceRight:
          Title: "[+] ProductsWritten (post-sync, REL-4)"

    - Source: StepFunctions
      SourcePosition: E
      Target: CloudWatch
      TargetPosition: NE
      LineStyle: dashed
      TargetArrowHead:
        Type: Open
      Labels:
        TargetRight:
          Title: "[+] exec + viz metrics"

    - Source: CloudWatch
      SourcePosition: S
      Target: Alarms
      TargetPosition: N
      TargetArrowHead:
        Type: Open

    - Source: Alarms
      SourcePosition: E
      Target: SNS
      TargetPosition: W
      TargetArrowHead:
        Type: Open
      Labels:
        TargetRight:
          Title: "[+] notify"
