# Final aggregation (CADU -> RDR -> SDR/GEO) as a CodeBuild job.
#
# Why CodeBuild and not the EC2 aggregation instance: the EC2 instance's
# security group is deliberately "SSM outbound HTTPS only" -- no route to
# the public internet. Before PERF-1, CSPP's ancillary staging fetched from
# http://jpssdb.ssec.wisc.edu at runtime; on EC2 that fetch times out 5x
# (~11 min) and CSPP dies with "TypeError: object of type 'bool' has no len()".
#
# PERF-1 (Requirement 8) caches the LUT DB in S3 and stages it from there on
# the hot path, removing the internet dependency from aggregation. The scheduled
# refresh job (infra/modules/sdr_pipeline/lut_cache.tf) still needs egress, but
# only once per week -- not per contact. This also unblocks ADR-001's compute
# platform bake-off (Requirement 11): removing the internet constraint means
# aggregation could move back to EC2 if the study recommends it.
#
# Required environment overrides:
#   RECEPTION_BUCKET  bucket Ground Station delivered the raw .pcap to
#   OUTPUT_BUCKET     SDR output bucket holding .cadu in and RDR/SDR out
#   CONTACT_ID        Ground Station contact UUID
#   CONTACT_DATE      YYYY/MM/DD, matching the S3 prefix

version: 0.2

env:
  variables:
    # aggregation.sh powers the host off when this is 1; a container must not.
    SELF_STOP: "0"
    RTSTPS_HOME: /opt/rt-stps
    CSPP_HOME: /opt/SDR_4_1
    CSPP_SDR_HOME: /opt/SDR_4_1
    CSPP_RT_HOME: /opt/SDR_4_1

phases:
  pre_build:
    commands:
      - echo "Aggregating contact ${CONTACT_ID} (${CONTACT_DATE})"
      # Take the script from S3 rather than the image's baked /opt/scripts copy,
      # so a redeploy of aggregation.sh takes effect without rebuilding the image.
      - aws s3 cp "s3://${OUTPUT_BUCKET}/software/aggregation.sh" /tmp/aggregation.sh
      - chmod +x /tmp/aggregation.sh
      - test -x "${CSPP_HOME}/bin/viirs_sdr.sh" || { echo "CSPP missing from image"; exit 1; }
      - test -x "${RTSTPS_HOME}/bin/batch.sh" || { echo "RT-STPS missing from image"; exit 1; }
      # DEPLOYMENT.md req 1 -- J01 shipped LUTs. The image carries straylight and
      # ecotiles but NOT shipped_luts, so check_installation() aborts with
      # "Installation problem .../SDR_4_1_DB/package needs to exist". Do NOT also
      # extract straylight/static_tiles here: they are already in the image and the
      # redundant ~10 GB fills the CodeBuild disk and breaks sdr_luts.sh.
      - aws s3 cp "s3://${OUTPUT_BUCKET}/software/CSPP_SDR_V4.1_static_luts_j01.tar.gz" /tmp/j01luts.tgz
      - tar xzf /tmp/j01luts.tgz -C /opt/ && rm -f /tmp/j01luts.tgz
      - test -d "${CSPP_HOME}/anc/static/shipped_luts/j01" || { echo "shipped_luts/j01 missing after extract"; exit 1; }
      # PERF-1 (Requirement 8) -- Stage LUT DB from S3 cache (fast path, ~seconds).
      # The cache (s3://${OUTPUT_BUCKET}/lut-cache/SDR_4_1_DB/) is populated by
      # the weekly lut_cache_refresh CodeBuild job
      # (infra/modules/sdr_pipeline/lut_cache.tf, rate(7 days)).
      #
      # Fast path (cache hit):  S3 sync stages the DB in seconds; sdr_luts.sh
      #                         is skipped entirely -- saves ~10 min per contact.
      # Slow path (cache miss): cache is empty (first run before the weekly job
      #                         has populated it); sdr_luts.sh runs as fallback,
      #                         identical behaviour to pre-PERF-1.
      - echo "PERF-1 staging LUT DB from S3 cache"
      - aws s3 sync "s3://${OUTPUT_BUCKET}/lut-cache/SDR_4_1_DB/" "${CSPP_HOME}/anc/static/SDR_4_1_DB/" || true
      - |
        if test -e "${CSPP_HOME}/anc/static/SDR_4_1_DB/package"; then
          echo "PERF-1 cache hit -- LUT DB staged from S3, skipping sdr_luts.sh"
        else
          echo "PERF-1 cache miss -- cache empty; running sdr_luts.sh fallback"
          cd "${CSPP_HOME}" && timeout 2400 ./bin/sdr_luts.sh > /tmp/luts.log 2>&1
          echo "sdr_luts exit $?"
          tail -5 /tmp/luts.log
          if ! test -e "${CSPP_HOME}/anc/static/SDR_4_1_DB/package"; then
            echo "LUT DB absent after sdr_luts.sh fallback"
            tail -40 /tmp/luts.log
            exit 1
          fi
        fi

  build:
    commands:
      - /tmp/aggregation.sh "${RECEPTION_BUCKET}" "${CONTACT_ID}" "${CONTACT_DATE}" "${OUTPUT_BUCKET}"

  post_build:
    commands:
      # aggregation.sh uploads its own logs via the EXIT trap; surface the tail
      # here too so a failure is visible in the CodeBuild console without S3.
      - echo "Exit status ${CODEBUILD_BUILD_SUCCEEDING}"
      - tail -40 /var/log/aggregation.log 2>/dev/null || true
